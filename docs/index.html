<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="K-POP 그룹의 SNS 팔로워 수를 실시간으로 확인하세요">
    <title>K-POP SNS 팔로워 트래커</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 K-POP SNS 팔로워 트래커</h1>
            <p class="subtitle">BOYNEXTDOOR, RIIZE, ZB1, TWS의 주요 SNS 팔로워 수를 한눈에 확인하세요</p>
        </header>

        <div class="controls">
            <button id="refreshBtn" class="btn btn-primary">
                <span class="icon">🔄</span>
                <span>최신 데이터 불러오기</span>
            </button>
            <button id="downloadBtn" class="btn btn-success">
                <span class="icon">📥</span>
                <span>CSV 다운로드</span>
            </button>
            <a href="https://github.com/dohyeong-kim-95/Followercheck/actions/workflows/scrape.yml"
               target="_blank"
               class="btn btn-action">
                <span class="icon">▶️</span>
                <span>수집 시작 (GitHub Actions)</span>
            </a>
        </div>

        <div id="lastUpdate" class="last-update">
            <span class="loading">데이터 로딩 중...</span>
        </div>

        <div class="table-wrapper">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th class="group-col">그룹</th>
                        <th class="platform-col">
                            <span class="platform-icon">▶️</span>
                            YouTube
                        </th>
                        <th class="platform-col">
                            <span class="platform-icon">📷</span>
                            Instagram
                        </th>
                        <th class="platform-col">
                            <span class="platform-icon">🎵</span>
                            TikTok
                        </th>
                        <th class="platform-col">
                            <span class="platform-icon">🐦</span>
                            X (Twitter)
                        </th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="loading-row">
                            <div class="spinner"></div>
                            <p>데이터를 불러오는 중입니다...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer>
            <p>
                <strong>사용 방법:</strong>
                "수집 시작" 버튼을 클릭하여 GitHub Actions 페이지에서 "Run workflow"를 클릭하면
                최신 데이터가 수집됩니다 (약 2-3분 소요).
            </p>
            <p class="github-link">
                <a href="https://github.com/dohyeong-kim-95/Followercheck" target="_blank">
                    View on GitHub
                </a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
